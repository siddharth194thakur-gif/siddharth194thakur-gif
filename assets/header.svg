<svg fill="none" viewBox="0 0 880 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>
    <radialGradient id="purpleGlow" cx="85%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
  </style>

  <!-- Card Background -->
  <rect width="880" height="260" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Grid & Radial Glow -->
  <rect width="880" height="260" rx="16" fill="url(#grid)" />
  <rect width="880" height="260" rx="16" fill="url(#purpleGlow)" />

  <!-- Terminal Window Bar -->
  <rect x="0" y="0" width="880" height="42" rx="16" fill="#090d16" fill-opacity="0.85" />
  <rect x="0" y="24" width="880" height="18" fill="#090d16" fill-opacity="0.85" />
  <line x1="0" y1="42" x2="880" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Terminal Controls -->
  <circle cx="28" cy="21" r="5" fill="#ef4444" />
  <circle cx="44" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />

  <text x="84" y="25" fill="#64748b" font-size="12" class="font-mono">siddharth@developer: ~/portfolio</text>
  <text x="710" y="25" fill="#818cf8" font-size="11" class="font-mono">● B.TECH CSE • AI/ML LEARNER</text>

  <!-- Focus Pill -->
  <rect x="36" y="60" width="270" height="24" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" />
  <text x="48" y="76" fill="#a5b4fc" font-size="11" font-weight="700" class="font-mono">🚀 PYTHON • AI/ML EXPLORER</text>

  <!-- Name / Title -->
  <text x="36" y="124" fill="url(#nameGrad)" font-size="34" font-weight="800" letter-spacing="-0.5" class="font-sans">SIDDHARTH SINGH</text>

  <!-- Accent Divider -->
  <line x1="36" y1="138" x2="480" y2="138" stroke="url(#accentLine)" stroke-width="2.5" />

  <!-- Subtitle -->
  <text x="36" y="166" fill="#cbd5e1" font-size="14.5" font-weight="500" class="font-sans">
    Python Foundation <tspan fill="#818cf8">•</tspan> Exploring AI &amp; Machine Learning <tspan fill="#818cf8">•</tspan> Team Contributor to HostelTalkies
  </text>

  <!-- 3 Highlights -->
  <g transform="translate(36, 196)">
    <!-- Block 1 -->
    <rect x="0" y="0" width="260" height="38" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="16" fill="#a5b4fc" font-size="10" font-weight="700" class="font-mono">PERSONAL SKILL &amp; FOCUS</text>
    <text x="14" y="29" fill="#94a3b8" font-size="11" class="font-sans">Python • Working Toward AI/ML</text>

    <!-- Block 2 -->
    <rect x="274" y="0" width="270" height="38" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="288" y="16" fill="#38bdf8" font-size="10" font-weight="700" class="font-mono">FEATURED TEAM PROJECT</text>
    <text x="288" y="29" fill="#94a3b8" font-size="11" class="font-sans">HostelTalkies (Collaborative Build)</text>

    <!-- Block 3 -->
    <rect x="558" y="0" width="250" height="38" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="572" y="16" fill="#34d399" font-size="10" font-weight="700" class="font-mono">COLLABORATION</text>
    <text x="572" y="29" fill="#94a3b8" font-size="11" class="font-sans">Team-Driven Development</text>
  </g>
</svg>
