<svg fill="none" viewBox="0 0 880 270" width="100%" height="270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>
    <radialGradient id="aiGlow" cx="85%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="15%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
  </style>

  <!-- Card Background -->
  <rect width="880" height="270" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Grid & Radial Glows -->
  <rect width="880" height="270" rx="16" fill="url(#grid)" />
  <rect width="880" height="270" rx="16" fill="url(#aiGlow)" />
  <rect width="880" height="270" rx="16" fill="url(#cyanGlow)" />

  <!-- Window Header / Terminal Bar -->
  <rect x="0" y="0" width="880" height="42" rx="16" fill="#090d16" fill-opacity="0.85" />
  <rect x="0" y="24" width="880" height="18" fill="#090d16" fill-opacity="0.85" />
  <line x1="0" y1="42" x2="880" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Terminal Window Controls -->
  <circle cx="28" cy="21" r="5" fill="#ef4444" />
  <circle cx="44" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />

  <text x="84" y="25" fill="#64748b" font-size="12" class="font-mono">siddharth@ai-workstation: ~/portfolio</text>
  <text x="730" y="25" fill="#818cf8" font-size="11" class="font-mono">● FOCUS: AI / ML CAREER</text>

  <!-- Focus Pill Badge -->
  <rect x="36" y="62" width="280" height="24" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
  <text x="48" y="78" fill="url(#aiGrad)" font-size="11.5" font-weight="700" class="font-mono">🤖 ASPIRING AI / ML ENGINEER</text>

  <!-- Name / Title -->
  <text x="36" y="128" fill="url(#nameGrad)" font-size="34" font-weight="800" letter-spacing="-0.5" class="font-sans">SIDDHARTH SINGH</text>

  <!-- Accent Divider -->
  <line x1="36" y1="142" x2="520" y2="142" stroke="url(#cyanLine)" stroke-width="2.5" />

  <!-- Professional Subtitle -->
  <text x="36" y="170" fill="#cbd5e1" font-size="14.5" font-weight="500" class="font-sans">
    AI/ML Fundamentals <tspan fill="#818cf8">|</tspan> Python &amp; Data Structures <tspan fill="#818cf8">|</tspan> Generative AI &amp; Agentic Workflows
  </text>

  <!-- Bottom Core Pillars -->
  <g transform="translate(36, 202)">
    <!-- Pillar 1: AI / ML -->
    <rect x="0" y="0" width="265" height="42" rx="8" fill="#0b1120" stroke="#312e81" stroke-width="1.2" />
    <text x="14" y="18" fill="#a5b4fc" font-size="10" font-weight="700" class="font-mono">PRIMARY CAREER DIRECTION</text>
    <text x="14" y="32" fill="#e2e8f0" font-size="11.5" font-weight="600" class="font-sans">AI/ML • Deep Learning • LLMs • RAG</text>

    <!-- Pillar 2: Core Engineering -->
    <rect x="277" y="0" width="260" height="42" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="291" y="18" fill="#38bdf8" font-size="10" font-weight="700" class="font-mono">CORE FOUNDATIONS</text>
    <text x="291" y="32" fill="#cbd5e1" font-size="11.5" class="font-sans">Python • DSA • SQL &amp; PostgreSQL</text>

    <!-- Pillar 3: Real-World Project -->
    <rect x="549" y="0" width="259" height="42" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="563" y="18" fill="#34d399" font-size="10" font-weight="700" class="font-mono">MAJOR REAL-WORLD PROJECT</text>
    <text x="563" y="32" fill="#cbd5e1" font-size="11.5" class="font-sans">HostelTalkies (hosteltalkies.fun)</text>
  </g>
</svg>
